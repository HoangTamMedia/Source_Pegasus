[Generic]
RenderFrame=0
ZTrickFix=1
Anisotropy=16
Multisample=4              ; was 16 - biggest single cost in combat; restore 16 to compare
MultisampleHint=0
Bloom=1
BloomSteps=2               ; how wide the glow spreads. Raise for a softer, larger halo
BloomDarken=3              ; the threshold. RAISE this if things bloom that should not
BloomScale=0.4             ; the strength. LOWER this if the whole screen looks lit up
SSAO=1                     ; was 0 - contact shadow where things meet the ground,
SSAOScale=1.0              ; so characters sit in the scene instead of floating on it
SSAOMinZ=0.0005
SSAOMaxZ=0.75
Hue=0
Saturation=15              ; Increase saturation slightly to enhance colors
Lightness=5                ; Increase lightness to brighten the image
Emboss=1
EmbossScale=0.4            ; Decrease this value to reduce sharpness
DOF=0
DOFMinZ=0.05
DOFSpeed=0.80
DOFScale=1.25
MotionBlur=0
Enabled=1
Priority=15
